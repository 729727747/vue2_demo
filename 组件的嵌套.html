<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div id="app"></div>
   
    <script src="vue.js"></script>
    
    <script>
        const student = Vue.extend({
        name:'student',
        template: `
        <div>
            <h2>学校学生</h2>
            <div>
                <p>学生姓名:{{studentName}}</p>
                <p>学生年龄:{{studentAge}}</p>
            </div>
        </div>
        `,
        data(){
            return {
                studentName: '学生小米',
                studentAge: 10
            }
        }
       })

       //创建组件
       const teacher = Vue.extend({
        name:'teacher',
        template: `
        <div>
            <h2>学校老师</h2>
            <div>
                <p>老师姓名:{{teacherName}}</p>
                <p>老师年龄:{{teacherAge}}</p>
                <student></student>
            </div>
        </div>
        `,
        data(){
            return {
                teacherName: '老师张三',
                teacherAge: 30
            }
        },
        components:{
            student:student
        }
       })

       const app =Vue.extend({
            name:'app',
            template: `
            <div>
                <teacher></teacher>
            </div>
            `,
            components:{
                teacher:teacher
            }
           })

       

       new Vue({
            el: '#app',
            data: {
               
            },
            template:`
            <div>
                <h1>武汉大学</h1>
                <hr>
                <app></app>
            </div>
            `,
            components:{
                app:app
            }
        })

    </script>
</body>
</html>
