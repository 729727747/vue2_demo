<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="app">
        <form @submit.prevent="submitForm">
            <label for="name">姓名：</label>
            <input type="text"  v-model.trim="name"><br>
            <label for="age">年龄：</label>
            <input type="number"  v-model.number="age"><br>
            性别：
            <input type="radio" v-model="sex" value="man">男
            <input type="radio" v-model="sex" value="woman">女
            <br>
            爱好：
            <input type="checkbox" v-model="hobby" value="basketball">篮球
            <input type="checkbox" v-model="hobby" value="football">足球
            <input type="checkbox" v-model="hobby" value="running">跑步
            <br>
            备注：
            <textarea  v-model.lazy="remark"></textarea>
            <br>
            同意：
            <input type="checkbox" v-model="agree" value="agree">同意协议
            <br>
            <input type="submit">
        </form>

    </div>
    <script src="vue.js"></script>
    <script>

        new Vue({
            el: '#app',
            data: {
                name: '',
                age: '',
                sex: '',
                hobby: [],
                remark: '',
                agree: false
            },
            methods: {
                submitForm() {
                    console.log(JSON.stringify(this.$data));
                }
            }
        })
      
    </script>
</body>
</html>
