<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="app">
        <h1>这个人名字叫{{name}},年龄是{{age}}</h1>
        <h2 v-bind:title="name">{{name}}</h2>
        <p>Using mustaches: {{ rawHtml }}</p>
        <p>Using v-html directive: <span v-html="rawHtml"></span></p>
        <button v-bind:disabled="isButtonDisabled">Button</button>
        <div > {{number + 1}}</div>
        <div > {{ ok ? 'YES' : 'NO' }}</div>
        <div  v-if="ok"> 是</div>
        <div  @click="click1">
            <div @click.stop="click2">
                点击我
            </div>
        </div>
        <div v-on:click="click3">
            点击我click3
        </div>
        <a v-bind:href="url">跳转到百度</a>
        <div v-on:[attributename]="click4"> ... </div>

        <!--计算属性 -->
        <div>计算属性1：{{computedName}}</div>
        <div>计算属性2：{{numberCount}}</div>
        <input v-model="firstName" placeholder="名">
        <input v-model="lastName" placeholder="姓">
        <input v-model="fullName" placeholder="全名" type="text">
        <p>全名: {{ fullName }}</p>
        
        <!--监听属性 -->
         <p>
            Ask a yes/no question:
            <input v-model="question">
        </p>
        <p>{{ answer }}</p>


    </div>
    <script src="vue.js"></script>
    <!-- 因为 AJAX 库和通用工具的生态已经相当丰富，Vue 核心代码没有重复 -->
    <!-- 提供这些功能以保持精简。这也可以让你自由选择自己更熟悉的工具。 -->
    <script src="https://cdn.jsdelivr.net/npm/axios@0.12.0/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lodash@4.13.1/lodash.min.js"></script>
    <script>
        var data = {
            name:"张三",
            age:18,
            rawHtml:"<b>这是一个粗体</b>",
            isButtonDisabled:false,
            number:100,
            ok:true,
            url:"https://www.baidu.com",
            attributename:"click",
            firstName:"张",
            lastName:"三",
            question: '',
            answer: 'I cannot give you an answer until you ask a question!'

        }
        // new Vue({
        //     el:"#app",
        //     data:data
        // })
        var app = new Vue({
            el:"#app",
            // data:{
            //     name:"张三",
            //     age:18
            // }
            data:data
            // ,created(){
            //     console.log("created:"+this.name)

            // },
            // beforeCreate(){
            //     console.log("beforeCreate")
            // } ,
            // updated(){
            //     console.log("updated")
            // },
            // destroyed(){
            //     console.log("destroyed")
            // }
            ,methods:{
                click1(){
                    console.log("click1")
                },
                click2(){
                    console.log("click2")
                },
                click3(){
                    console.log("click3")
                },
                click4(){
                    console.log("click4")
                },
                getAnswer: function () {
                if (this.question.indexOf('?') === -1) {
                    this.answer = 'Questions usually contain a question mark. ;-)'
                    return
                }
                this.answer = 'Thinking...'
                var vm = this
                axios.get('https://yesno.wtf/api')
                    .then(function (response) {
                    vm.answer = _.capitalize(response.data.answer)
                    })
                    .catch(function (error) {
                    vm.answer = 'Error! Could not reach the API. ' + error
                    })
                }
            },
            $watch:{
                name(newVal,oldVal){
                    console.log("name变化了，从" + oldVal + "变成了" + newVal)
                },
                age(newVal,oldVal){
                    console.log("age变化了，从" + oldVal + "变成了" + newVal)
                },
                // 如果 `question` 发生改变，这个函数就会运行
                question: function (newQuestion, oldQuestion) {
                    this.answer = 'Waiting for you to stop typing...'
                    this.debouncedGetAnswer()
                }
            },created: function () {
                // `_.debounce` 是一个通过 Lodash 限制操作频率的函数。
                // 在这个例子中，我们希望限制访问 yesno.wtf/api 的频率
                // AJAX 请求直到用户输入完毕才会发出。想要了解更多关于
                // `_.debounce` 函数 (及其近亲 `_.throttle`) 的知识，
                // 请参考：https://lodash.com/docs#debounce
                this.debouncedGetAnswer = _.debounce(this.getAnswer, 500)
            },computed:{
                computedName(){
                    return this.name + "的年龄是" + this.age
                },
                numberCount(){
                    return this.number * 2
                }
                ,fullName:{
                    get(){
                        return this.firstName + this.lastName
                    },
                    set(newVal){
                        if (newVal.length >= 2) {
                            this.firstName = newVal.charAt(0)
                            this.lastName = newVal.slice(1)
                        }
                    }
                }
            }
            
        })


    </script>
</body>
</html>
